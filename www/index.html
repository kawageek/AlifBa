<html lang="fr">

<title>Alif Ba – J'apprends l'arabe</title>
<style>
:root{
  --bg:#FFF8EC; --ink:#2B2D42; --soft:#6B6F80;
  --teal:#2EC4B6; --coral:#FF6B6B; --sun:#FFC93C; --sky:#4D96FF; --leaf:#6BCB77; --plum:#9B5DE5; --peach:#FF9F68;
  --card:#FFFFFF; --shadow:0 6px 0 rgba(43,45,66,.12);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Nunito","Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}

.ar{font-family:var(--ar);direction:rtl}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{flex:1;margin:0;font-size:24px;text-align:center}
.round{width:54px;height:54px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:26px;display:grid;place-items:center;flex:none}
.round:active,.tile:active,.opt:active,.card:active,.big:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,45,66,.12)}
.stars{background:var(--sun);border-radius:30px;padding:8px 14px;font-weight:800;font-size:20px;box-shadow:var(--shadow);flex:none}
.hello{text-align:center;margin:4px 0 18px}
.hello .ar{font-size:40px;font-weight:700;color:var(--teal)}
.hello .fr{font-size:20px;color:var(--soft)}
.sect{font-size:18px;font-weight:800;color:var(--soft);margin:18px 4px 10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
@media(min-width:600px){.g3{grid-template-columns:repeat(4,1fr)}.g4{grid-template-columns:repeat(6,1fr)}}
.tile{border-radius:24px;padding:16px 10px;color:#fff;box-shadow:var(--shadow);text-align:center;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile .ico{font-size:40px;line-height:1}
.tile .lbl{font-weight:800;font-size:18px}
.tile .sub{font-size:22px;font-family:var(--ar);opacity:.95}
.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:96px}
.card .big-ar{font-family:var(--ar);font-size:46px;line-height:1.25}
.card .emo{font-size:44px;line-height:1.1}
.card .w{font-family:var(--ar);font-size:22px;direction:rtl}
.card .f{font-size:14px;color:var(--soft)}
.card.done{outline:4px solid var(--leaf)}
.hero{background:var(--card);border-radius:30px;box-shadow:var(--shadow);padding:20px;text-align:center;margin-bottom:16px}
.hero .giant{font-family:var(--ar);font-size:150px;line-height:1.15;color:var(--plum)}
.hero .name{font-family:var(--ar);font-size:36px}
.hero .tr{color:var(--soft);font-size:18px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.big{border-radius:22px;padding:16px 22px;font-weight:800;font-size:20px;color:#fff;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.example{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px;background:#F4F7FF;border-radius:20px;padding:12px}
.example .emo{font-size:64px}
.example .w{font-family:var(--ar);font-size:38px}
.prompt{text-align:center;margin:8px 0 18px}
.prompt .speak{width:96px;height:96px;border-radius:50%;background:var(--sky);color:#fff;font-size:46px;box-shadow:var(--shadow);margin:0 auto;display:grid;place-items:center}
.prompt .txt{font-size:18px;color:var(--soft);margin-top:10px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.opt{background:var(--card);border-radius:26px;box-shadow:var(--shadow);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:72px}
.opt .ar{font-size:76px;line-height:1.2}
.opt small{font-size:18px;color:var(--soft);font-family:inherit}
.opt.good{background:#DDF7E2;outline:5px solid var(--leaf)}
.opt.bad{animation:shake .4s;background:#FFE3E3}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.progress i{width:16px;height:16px;border-radius:50%;background:#E3E1DA;display:block}
.progress i.on{background:var(--sun)}
.count-box{background:var(--card);border-radius:26px;box-shadow:var(--shadow);padding:14px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;font-size:48px;min-height:160px;align-content:center;margin-bottom:16px}
.count-box span{transition:transform .2s}
.count-box span.tapped{transform:scale(1.25);filter:drop-shadow(0 0 6px var(--sun))}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(min-width:600px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{aspect-ratio:1/1;border-radius:20px;box-shadow:var(--shadow);position:relative;perspective:600px}
.mc .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.mc.open .in,.mc.found .in{transform:rotateY(180deg)}
.mc .fa,.mc .ba{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:grid;place-items:center}
.mc .fa{background:linear-gradient(135deg,var(--teal),var(--sky));font-size:40px;color:#fff}
.mc .ba{background:var(--card);transform:rotateY(180deg);font-size:46px;padding:4px;text-align:center}
.mc .ba .ar{font-size:30px;line-height:1.2}
.mc.found .ba{background:#DDF7E2}
.trace-wrap{background:var(--card);border-radius:30px;box-shadow:var(--shadow);position:relative;aspect-ratio:1/1;max-width:520px;margin:0 auto 14px;touch-action:none;overflow:hidden}
.trace-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.meter{height:16px;background:#EEE;border-radius:10px;overflow:hidden;max-width:520px;margin:0 auto 14px}
.meter b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sun),var(--leaf));transition:width .2s}
.stk{font-size:54px;aspect-ratio:1/1;display:grid;place-items:center;border-radius:20px;background:var(--card);box-shadow:var(--shadow)}
.stk.lock{filter:grayscale(1) opacity(.25)}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:50}
.celebrate .burst{font-size:120px;animation:pop 1s ease-out forwards}
@keyframes pop{0%{transform:scale(.2);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.confetti{position:fixed;top:-20px;font-size:28px;animation:fall 1.6s linear forwards;z-index:49;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.end{text-align:center;padding:30px 10px}
.end .emo{font-size:110px}
.end h2{font-size:30px;margin:10px 0}
.end .ar{font-size:42px;color:var(--teal)}
.parent label{display:block;font-weight:800;margin:14px 0 6px}
.parent input,.parent select{width:100%;font:inherit;font-size:20px;padding:12px 14px;border-radius:14px;border:2px solid #DDD;background:#fff;user-select:text;-webkit-user-select:text}
.hint{font-size:15px;color:var(--soft);text-align:center;margin-top:10px}
.holdgear{position:relative}
.holdgear::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:4px solid var(--teal);clip-path:inset(0 100% 0 0);transition:clip-path 1.5s linear}
.holdgear.holding::after{clip-path:inset(0 0 0 0)}
.digits{font-size:15px;color:var(--soft)}
</style>
</head>

function pickVoice(lang){
  if(!('speechSynthesis' in window)) return null;

  return vs.find(v=>v.lang.replace('_','-')===lang) || vs.find(v=>v.lang.toLowerCase().startsWith(p)) || null;
}

    const v = pickVoice(lang); if(v) u.voice = v;
    let done=false; const fin=()=>{ if(!done){done=true;res();} };
    u.onend = fin; u.onerror = fin; setTimeout(fin, 900 + text.length*160);
    speechSynthesis.speak(u);
  });
}
// parts: [['fr','Touche'],['ar','قِطّ']]
async function say(...parts){
  const my = ++speakToken;
  stopSpeech(false);
  for(const [l,t] of parts){
    if(my!==speakToken) return;
    await sayOne(t, l==='ar' ? 'ar-SA' : 'fr-FR');
  }
}
function stopSpeech(bump=true){
  if(bump) speakToken++;
  const tts = NativeTTS(); if(tts){ try{ tts.stop(); }catch(e){} }
  if('speechSynthesis' in window) speechSynthesis.cancel();
}

function Quiz(src,id){
  const items = bank(src,id);
  const targets = pick(items, Math.min(ROUNDS, items.length));
  let round=0, score=0, locked=false, tries=0;
  const title = src==='L'?'Écoute : lettres':src==='N'?'Écoute : chiffres':'Écoute : '+THEMES.find(x=>x.id===id).fr;
  function draw(){
    if(round>=targets.length) return End(score, targets.length, ()=>{stack.pop();go(Quiz,src,id);});
    const target = targets[round];
    const opts = shuffle([target, ...pick(items.filter(x=>x.key!==target.key),3)]);
    tries=0; locked=false;
    app.innerHTML = bar(title) + `
      <div class="progress">${targets.map((_,k)=>`<i class="${k<round?'on':''}"></i>`).join('')}</div>
      <div class="prompt"><button class="speak" id="sp">🔊</button><div class="txt">Écoute bien, puis touche la bonne réponse</div></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.opt}</button>`).join('')}</div>`;
    $('#sp').onclick = ()=>say(...target.prompt);
    app.querySelectorAll('.opt').forEach(b=>b.onclick=async ()=>{
      if(locked) return;
      const o = opts[+b.dataset.k];
      if(o.key===target.key){
        locked=true; b.classList.add('good'); vibrate(40);
        if(tries===0){ score++; const st=addStar(); celebrate(st||'⭐'); }
        await praise(); round++; setTimeout(draw,250);

        tries++; b.classList.add('bad'); vibrate([30,40,30]);
        setTimeout(()=>b.classList.remove('bad'),450);
        say(...o.name, ['fr','Essaie encore !']);
      }
    });
    setTimeout(()=>say(...target.prompt),300);
  }
  draw();
}

function Trace(kind, i){
  const isL = kind==='L';
  const ch = isL ? LETTERS[i].c : AR_DIGITS[i];
  const nm = isL ? LETTERS[i].n : NUMBERS[i].n;
  const max = isL ? 27 : 10;
  app.innerHTML = bar(isL?`Trace la lettre ${nm}`:`Trace le chiffre ${i}`) + `
    <div class="trace-wrap" id="wrap"><canvas id="guide"></canvas><canvas id="draw"></canvas></div>
    <div class="meter"><b id="m"></b></div>
    <div class="row">
      <button class="big" style="background:var(--soft)" id="clr">🧽 Effacer</button>
      <button class="big" style="background:var(--sky)" id="rep">🔊</button>
      <button class="big" style="background:var(--leaf)" id="nx">Suivant ▶</button>
    </div>
    <p class="hint">Suis la lettre grise avec ton doigt</p>`;
  const wrap=$('#wrap'), gc=$('#guide'), dc=$('#draw');
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const W = wrap.clientWidth;
  [gc,dc].forEach(c=>{ c.width=W*dpr; c.height=W*dpr; });
  const g=gc.getContext('2d'), d=dc.getContext('2d');
  g.scale(dpr,dpr); d.scale(dpr,dpr);
  const fontPx = Math.round(W*(isL?0.62:0.6));
  const font = `bold ${fontPx}px ${getComputedStyle(document.documentElement).getPropertyValue('--ar')}`;
  // mesurer pour centrer verticalement
  g.font=font; g.textAlign='center'; g.textBaseline='alphabetic';
  const mt = g.measureText(ch);
  const asc = mt.actualBoundingBoxAscent||fontPx*.7, desc = mt.actualBoundingBoxDescent||fontPx*.2;
  const y = W/2 + (asc-desc)/2;
  function drawGuide(){
    g.clearRect(0,0,W,W);
    g.font=font; g.textAlign='center';
    g.fillStyle='#ECEAF6'; g.fillText(ch, W/2, y);
    g.setLineDash([6,8]); g.lineWidth=3; g.strokeStyle='#B9B2D9'; g.strokeText(ch, W/2, y); g.setLineDash([]);
  }
  drawGuide();
  // masque de la lettre (basse résolution) pour mesurer la couverture
  const R=120, sc=R/W;
  const mk=document.createElement('canvas'); mk.width=mk.height=R; const m=mk.getContext('2d');
  m.scale(sc,sc); m.font=font; m.textAlign='center'; m.fillStyle='#000'; m.fillText(ch,W/2,y);
  const maskData = m.getImageData(0,0,R,R).data;
  const mz=document.createElement('canvas'); mz.width=mz.height=R; const z=mz.getContext('2d');
  z.scale(sc,sc); z.font=font; z.textAlign='center'; z.fillStyle='#000'; z.strokeStyle='#000'; z.lineWidth=W*0.09; z.lineJoin='round'; z.fillText(ch,W/2,y); z.strokeText(ch,W/2,y);
  const zoneData = z.getImageData(0,0,R,R).data;
  let maskCount=0; for(let p=3;p<maskData.length;p+=4) if(maskData[p]>100) maskCount++;
  const lw = W*0.075;
  const colors=['#FF6B6B','#4D96FF','#6BCB77','#9B5DE5','#FF9F68'];
  d.lineCap='round'; d.lineJoin='round'; d.lineWidth=lw; d.strokeStyle=rnd(colors);
  let drawing=false, last=null, done=false;
  const pos = e=>{ const r=dc.getBoundingClientRect(); return [(e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(W/r.height)]; };
  function check(){
    const u=document.createElement('canvas'); u.width=u.height=R; const uc=u.getContext('2d'); uc.drawImage(dc,0,0,R,R);
    const ud=uc.getImageData(0,0,R,R).data; let cov=0, ink=0, out=0;
    for(let p=3;p<ud.length;p+=4){ if(ud[p]>60){ ink++; if(maskData[p]>100) cov++; if(zoneData[p]<60) out++; } }
    const coverage = maskCount? cov/maskCount : 0;
    $('#m').style.width = Math.min(100, coverage/0.6*100)+'%';
    if(!done && coverage>=0.6 && ink>0 && out/ink<0.25){
      done=true; vibrate(60); const st=addStar(); celebrate(st||'🌟');
      say(['ar',nm]).then(praise);
    } else if(!done && ink>0 && out/ink>=0.25 && coverage>=0.45){
      say(['fr','Reste bien sur la lettre !']);
    }
  }
  dc.addEventListener('pointerdown',e=>{ e.preventDefault(); dc.setPointerCapture(e.pointerId); drawing=true; last=pos(e); d.beginPath(); d.moveTo(...last); d.lineTo(last[0]+.1,last[1]+.1); d.stroke(); });
  dc.addEventListener('pointermove',e=>{ if(!drawing) return; const p=pos(e); d.beginPath(); d.moveTo(...last); d.lineTo(...p); d.stroke(); last=p; });
  const up=()=>{ if(!drawing) return; drawing=false; check(); };
  dc.addEventListener('pointerup',up); dc.addEventListener('pointercancel',up);
  $('#clr').onclick=()=>{ d.clearRect(0,0,W,W); d.strokeStyle=rnd(colors); done=false; $('#m').style.width='0'; };
  $('#rep').onclick=()=>say(['ar',nm]);
  $('#nx').onclick=()=>{ stack.pop(); go(Trace,kind, i>=max?0:i+1); };
  say(['fr','Trace'],['ar',nm]);
}

// ----- Fin de partie -----
function End(score, total, replay, msg){
  const ratio = score/total;
  const emo = ratio>=.8?'🏆':ratio>=.5?'🌟':'💪';
  const n = childName();
  app.innerHTML = bar('Bravo !') + `
    <div class="end">
      <div class="emo">${emo}</div>
      <div class="ar">أَحْسَنْتَ${n?' يَا '+n:''}!</div>
      <h2>${msg || `${score} ${score>1?'étoiles gagnées':'étoile gagnée'} sur ${total}`}</h2>
      <div class="row" style="margin-top:20px">
        <button class="big" style="background:var(--teal)" id="again">🔁 Rejouer</button>
        <button class="big" style="background:var(--plum)" onclick="home()">🏠 Accueil</button>
      </div>
    </div>`;
  $('#again').onclick = replay;
  celebrate(emo);
  say(['ar','أَحْسَنْتَ'],['fr', ratio>=.5?'Tu as très bien joué'+(n?' '+n:'')+' !':'Continue, tu progresses'+(n?' '+n:'')+' !']);
}

// ----- Autocollants -----
function Stickers(){
  const got = Math.min(Math.floor(S.stars/STARS_PER_STICKER), STICKERS.length);
  const left = STARS_PER_STICKER - (S.stars % STARS_PER_STICKER);
  app.innerHTML = bar('Mes autocollants') + `
    <p class="hint" style="font-size:18px;margin-top:0">${got<STICKERS.length?`Encore ${left} ⭐ pour le prochain autocollant !`:'Tu as tous les autocollants ! 🏆'}</p>
    <div class="grid g4">${STICKERS.map((s,k)=>`<button class="stk ${k<got?'':'lock'}">${k<got?s:'❓'}</button>`).join('')}</div>`;
}

// ----- Espace parent -----
function Parent(){
  app.innerHTML = bar('Espace parent', false) + `
  <div class="hero parent" style="text-align:left">
    <label for="nm">Prénom de l'enfant</label>
    <input id="nm" value="${S.name.replace(/"/g,'&quot;')}" placeholder="ex. Adam" maxlength="20">
    <label for="dg">Affichage des chiffres</label>
    <select id="dg">
      <option value="both" ${S.digits==='both'?'selected':''}>Les deux (١ et 1)</option>
      <option value="ar" ${S.digits==='ar'?'selected':''}>Chiffres arabes orientaux (١ ٢ ٣)</option>
      <option value="lat" ${S.digits==='lat'?'selected':''}>Chiffres occidentaux (1 2 3)</option>
    </select>
    <label for="rt">Vitesse de la voix</label>
    <select id="rt">
      <option value="0.7" ${S.rate==0.7?'selected':''}>Lente</option>
      <option value="0.85" ${S.rate==0.85?'selected':''}>Normale</option>
      <option value="1" ${S.rate==1?'selected':''}>Rapide</option>
    </select>
    <div class="row" style="margin-top:18px;justify-content:flex-start">
      <button class="big" style="background:var(--sky)" id="test">🔊 Tester la voix arabe</button>
    </div>
    <div class="sect">Progression</div>
    <div>⭐ ${S.stars} étoiles · 🔤 ${S.seenL.length}/28 lettres vues · 🔢 ${S.seenN.length}/11 chiffres vus</div>
    <div class="row" style="margin-top:18px;justify-content:flex-start">
      <button class="big" style="background:var(--coral)" id="reset">♻️ Remettre à zéro</button>
    </div>
    <p class="hint" style="text-align:left">Si la voix arabe ne marche pas : Paramètres Android › Système › Langues › Synthèse vocale › Moteur Google › installer les données vocales « Arabe ».</p>
  </div>`;
  $('#nm').oninput = e=>{ S.name=e.target.value; save(); };
  $('#dg').onchange = e=>{ S.digits=e.target.value; save(); };
  $('#rt').onchange = e=>{ S.rate=parseFloat(e.target.value); save(); };
  $('#test').onclick = ()=>say(['ar','مَرْحَبًا'+(childName()?' '+childName():'')+'، أَلِف، بَاء، تَاء']);
  $('#reset').onclick = ()=>{ if(app.querySelector('#reset').dataset.c){ S=Object.assign({},DEFAULT,{name:S.name,digits:S.digits,rate:S.rate}); save(); Parent(); } else { const b=app.querySelector('#reset'); b.dataset.c=1; b.textContent='Toucher encore pour confirmer'; } };
}

// ---------- DÉMARRAGE ----------
document.addEventListener('backbutton', e=>{ e.preventDefault(); back(); });
(function initNative(){
  const A = nativePlugin('App');
  if(A){ A.addListener('backButton', ()=>{ if(stack.length>1) back(); else A.exitApp(); }); }
})();
home();
</script>
